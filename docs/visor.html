<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batallas de gallos</title>
<script>
  // el tema se fija antes de pintar, para que no haya un fogonazo blanco
  document.documentElement.dataset.tema = localStorage.getItem('tema') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
</script>
<style>
  :root { --papel:#f4f5f2; --papel2:#e9ebe6; --tinta:#14161a; --tenue:#666c66;
          --linea:#d3d7d0; --acento:#c2185b; --campo:#fff }
  :root[data-tema="oscuro"] { --papel:#15161a; --papel2:#1e2024; --tinta:#e8e9e4;
          --tenue:#9aa09a; --linea:#2e3135; --acento:#f0538f; --campo:#1b1d21 }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema]) { --papel:#15161a; --papel2:#1e2024; --tinta:#e8e9e4;
            --tenue:#9aa09a; --linea:#2e3135; --acento:#f0538f; --campo:#1b1d21 }
  }
  * { box-sizing:border-box }
  body { margin:0; height:100dvh; display:flex; flex-direction:column;
         background:var(--papel); color:var(--tinta); font:16px/1.5 Georgia,serif }
  header { display:flex; gap:.7rem; align-items:center; padding:.6rem 1rem;
           border-bottom:2px solid var(--tinta) }
  h1 { font:400 1.15rem/1 "Arial Narrow",sans-serif; margin:0; white-space:nowrap }
  input { flex:1; max-width:22rem; padding:.3rem .5rem; border:1px solid var(--tinta);
          background:var(--campo); color:var(--tinta); font:inherit; font-size:.9rem }
  #volver { font:inherit; font-size:.85rem; border:0; background:none; cursor:pointer;
            padding:0; text-decoration:underline; color:var(--tinta) }
  #tema { border:0; background:none; color:var(--tenue); cursor:pointer;
          font:400 1rem/1 Georgia,serif; padding:.2rem .4rem }
  #tema:hover { color:var(--acento) }
  main { flex:1; min-height:0; display:flex }
  #lista { flex:1; overflow-y:auto; margin:0; padding:0; list-style:none }
  #lista button { display:block; width:100%; text-align:left; padding:.5rem 1rem; border:0;
                  border-bottom:1px solid var(--linea); background:none; font:inherit;
                  color:inherit; font-size:.9rem; line-height:1.3; cursor:pointer }
  #lista button:hover { background:var(--papel2) }
  #lista button[aria-current] { background:var(--papel2) }
  #lista b { display:block }
  #lista span { color:var(--tenue); font-size:.85em }
  #texto { flex:1; overflow-y:auto; padding:1rem 1.2rem 4rem }
  #texto h2 { font:400 1.5rem/1.05 "Arial Narrow",sans-serif; margin:0 0 .3rem }
  #texto .meta { margin:0 0 1.2rem; color:var(--tenue); font-size:.8rem }
  #texto p.barra { margin:0 0 .7rem; max-width:66ch; position:relative }
  #texto .contra { font:italic .65em Georgia,serif; color:var(--tenue) }
  /* anotaciones Jev */
  #texto p.ruido { background:repeating-linear-gradient(-45deg, transparent 0 6px, color-mix(in srgb, var(--acento) 14%, transparent) 6px 12px); border-radius:3px; cursor:help }
  #texto p.mixto { background:repeating-linear-gradient(-45deg, transparent 0 6px, color-mix(in srgb, #d8a012 16%, transparent) 6px 12px); border-radius:3px; cursor:help }
  #texto p.corrupta { background:color-mix(in srgb, #888 14%, transparent); border-radius:3px; cursor:help }
  #texto .tag { position:absolute; top:-.55rem; right:-.3rem; font:600 .6rem/1 "Arial Narrow",sans-serif;
                padding:.15rem .3rem; border-radius:3px; background:var(--papel2); color:var(--tenue);
                border:1px solid var(--linea) }
  #texto p.ruido .tag { color:var(--acento); border-color:var(--acento) }
  #texto p.destacado { outline:2px solid var(--acento); outline-offset:2px; border-radius:3px }
  /* anotaciones Jev: integradas en la columna de texto, sin cajas */
  #jev { max-width:66ch; margin:0 0 1.2rem; font-size:.78rem; color:var(--tenue) }
  #jev .linea { display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap }
  #jev .dist { flex:1; min-width:8rem; height:.45rem; display:flex; border-radius:2px; overflow:hidden;
               background:var(--papel2); align-self:center }
  #jev .dist button { border:0; padding:0; height:100%; background:transparent; cursor:pointer }
  #jev .dist button:hover { filter:brightness(1.2) }
  #jev .dist .mixto   { background:color-mix(in srgb, #d8a012 60%, var(--campo)) }
  #jev .dist .ruido   { background:color-mix(in srgb, var(--acento) 60%, var(--campo)) }
  #jev .dist .corrupta{ background:color-mix(in srgb, #888 50%, var(--campo)) }
  #jev .med { white-space:nowrap }
  #jev .pips { display:inline-flex; gap:2px; vertical-align:1px; margin:0 .15rem }
  #jev .pips i { width:.38rem; height:.38rem; border-radius:50%; border:1px solid var(--linea); background:var(--papel2) }
  #jev .pips i.on { background:var(--tinta); border-color:var(--tinta) }
  #jev .aviso { color:var(--acento) }
  #filtro-j { margin-left:.5rem; font:inherit; font-size:.78rem; border:1px solid var(--linea);
              background:var(--campo); color:var(--tinta); padding:.15rem .3rem }
  #lista .mini { display:inline-block; margin-left:.35rem; font:600 .62rem/1 "Arial Narrow",sans-serif;
                 padding:.1rem .3rem; border-radius:3px; background:var(--papel2); color:var(--tenue);
                 border:1px solid var(--linea); vertical-align:1px }
  #lista .mini.ru { color:var(--acento); border-color:color-mix(in srgb, var(--acento) 50%, transparent) }
  #lista .jbar { display:inline-block; width:3.2rem; height:.4rem; margin-left:.45rem; vertical-align:1px;
                 border:1px solid var(--linea); border-radius:2px; background:var(--papel2); overflow:hidden }
  #lista .jbar i { display:block; height:100%; background:color-mix(in srgb, var(--acento) 55%, var(--campo)) }
  #lista .jbar i.c { background:color-mix(in srgb, #888 45%, var(--campo)) }
</style>
</head>
<body>
<header>
  <button id="volver" hidden>← Batallas</button>
  <h1>Batallas de gallos</h1>
  <input id="q" type="search" placeholder="Buscar MC, evento o ronda…">
  <select id="filtro-j" title="Filtrar por anotación de Jev">
    <option value="">Todas</option>
    <option value="limpias">Sin ruido</option>
    <option value="ruido">Con ruido</option>
    <option value="corrupta">Con bloques corruptos</option>
  </select>
  <button id="tema" title="Cambiar entre claro y oscuro" aria-label="Cambiar entre claro y oscuro">◐</button>
</header>
<main>
  <ol id="lista"></ol>
  <div id="texto" hidden></div>
</main>

<script src="data/index.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const nf = new Intl.NumberFormat('es-ES');
  const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const CORPUS = window.CORPUS || [];
  const cache = {};
  let filtro = CORPUS;

  // junta las lineas de subtitulo en parrafos legibles de ~45 palabras,
  // devolviendo también el índice de línea en el que empieza cada párrafo
  function parrafos(lineas) {
    const out = []; let cur = [], n = 0, i0 = 0;
    for (let i = 0; i < lineas.length; i++) {
      const t = String(lineas[i] || '').replace(/\[[^\]]*\]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!t) continue;
      if (!cur.length) i0 = i;
      cur.push(t); n += t.split(' ').length;
      if (n >= 45) { out.push({ t: cur.join(' '), i0 }); cur = []; n = 0; }
    }
    if (cur.length) out.push({ t: cur.join(' '), i0 });
    return out;
  }

  // etiqueta Jev de un párrafo según el bloque que lo contiene
  function tagDe(i0, bloques) {
    if (!bloques) return null;
    return bloques.find(b => i0 >= b.i0 && i0 < b.i1) || null;
  }
  function claseJ(b) {
    if (!b) return '';
    if (b.ruido > 0.7) return 'ruido';
    if (b.calidad === 'corrupta') return 'corrupta';
    if (b.pct_rapeo < 3.5) return 'mixto';
    return '';
  }
  function tituloJ(b) {
    if (!b) return '';
    return `Jev · ruido ${b.ruido.toFixed(2)} · rapeo ${b.rapeo.toFixed(2)} (${Math.round(b.pct_rapeo/5*100)}%) · ` +
           `rima ${b.rima.toFixed(1)}/5 · punch ${b.punch.toFixed(1)}/5 · ${b.calidad}`;
  }
  function pips(v) {  // medidor de 5 puntos para rima/punch
    const n = Math.max(0, Math.min(5, Math.round(v)));
    return `<span class="pips">${[0,1,2,3,4].map(i => `<i${i < n ? ' class="on"' : ''}></i>`).join('')}</span>`;
  }

  function lista() {
    $('#lista').innerHTML = filtro.map(b => {
      const quien = (b.mcs || []).join(' vs ') || b.title || b.video_id;
      const donde = [b.event, b.round, b.year].filter(Boolean).join(' · ');
      const j = b.jev;
      const chips = j ? `<span class="jbar" title="Jev: ${j.pct_ruido}% de bloques con ruido · rima ${j.rima.toFixed(1)}/5 · punch ${j.punch.toFixed(1)}/5${j.n_corruptos ? ` · ${j.n_corruptos} corruptos` : ''}"><i class="${j.n_corruptos ? 'c' : ''}" style="width:${j.pct_ruido}%"></i></span>` +
                        `<span class="mini" title="rima media de Jev">R${j.rima.toFixed(1)}</span>` +
                        `<span class="mini" title="punch medio de Jev">P${j.punch.toFixed(1)}</span>` : '';
      return `<li><button data-id="${b.video_id}">
        <b>${esc(quien)}${chips}</b><span>${esc(donde)}</span></button></li>`;
    }).join('') || '<li style="padding:.6rem">Nada con ese filtro.</li>';
  }

  function portada() {
    $('#texto').hidden = true; $('#lista').hidden = false;
    $('#volver').hidden = true; $('#q').hidden = false;
  }

  function filtra() {
    const q = $('#q').value.trim().toLowerCase();
    const fj = $('#filtro-j').value;
    filtro = CORPUS.filter(b => {
      if (q && ![b.title, b.event, b.round, (b.mcs || []).join(' ')].join(' ').toLowerCase().includes(q)) return false;
      if (fj && b.jev) {
        if (fj === 'limpias' && b.jev.pct_ruido > 15) return false;
        if (fj === 'ruido' && b.jev.pct_ruido <= 15) return false;
        if (fj === 'corrupta' && !(b.jev.n_corruptos > 0)) return false;
      }
      return true;
    });
    lista();
  }

  async function abre(id) {
    $('#lista').hidden = true; $('#texto').hidden = false;
    $('#volver').hidden = false; $('#q').hidden = true;
    const caja = $('#texto');
    caja.innerHTML = '<p class="meta">Cargando…</p>';
    try {
      const b = cache[id] || (cache[id] = await (await fetch('data/battles/' + id + '.json')).json());
      const mcs = (b.mcs || []).map(esc);
      const meta = [b.event, b.round, b.year, b.format,
                    nf.format(b.n_words) + ' palabras'].filter(Boolean).join(' · ');
      const j = b.bloques ? (() => {
        const utiles = b.bloques.filter(x => x.ruido < 0.7);
        const r = a => a.reduce((s, x) => s + x, 0) / Math.max(a.length, 1);
        const nCorr = b.bloques.filter(x => x.calidad === 'corrupta').length;
        return { pctRuido: Math.round(100 * (b.bloques.length - utiles.length) / b.bloques.length),
                 rima: r(utiles.map(x => x.rima)), punch: r(utiles.map(x => x.punch)), nCorr };
      })() : null;
      // barra de distribución: un segmento por bloque, proporcional a sus palabras;
      // coloreado según la clase Jev y clicable para saltar al bloque
      const barra = j ? (() => {
        const total = b.bloques.reduce((s, x) => s + x.palabras, 0) || 1;
        const segs = b.bloques.map((x, i) => {
          const cls = claseJ(x) || 'ok';
          return `<button class="${cls}" data-i0="${x.i0}" style="width:${(100 * x.palabras / total).toFixed(2)}%" ` +
                 `title="Bloque ${i + 1} de ${b.bloques.length} · ${cls === 'ok' ? 'limpio' : cls} · ${tituloJ(x)}" ` +
                 `aria-label="Ir al bloque ${i + 1}"></button>`;
        }).join('');
        return `<div class="dist" role="group" aria-label="Distribución de bloques según Jev">${segs}</div>`;
      })() : '';
      const panel = j ? `<div id="jev">
        <div class="linea">
          <span class="dist" role="group" aria-label="Distribución de bloques según Jev">${barra}</span>
          <span class="med" title="rima media de los bloques limpios: ${j.rima.toFixed(2)}/5">rima${pips(j.rima)}${j.rima.toFixed(1)}</span>
          <span class="med" title="punch medio de los bloques limpios: ${j.punch.toFixed(2)}/5">punch${pips(j.punch)}${j.punch.toFixed(1)}</span>
          <span class="med${j.pctRuido > 15 ? ' aviso' : ''}" title="${j.pctRuido}% de los bloques con ruido${j.nCorr ? `, ${j.nCorr} corruptos` : ''}">${j.pctRuido}% ruido${j.nCorr ? ` · ${j.nCorr} corr` : ''}</span>
        </div>
      </div>` : '';
      caja.innerHTML = `<h2>${mcs.length ? mcs.join(' <span class="contra">contra</span> ') : esc(b.title || id)}</h2>
        <p class="meta">${esc(meta)} · <a href="${b.url}" target="_blank" rel="noopener">vídeo</a></p>` + panel +
        parrafos(b.lines).map(p => {
          const t = tagDe(p.i0, b.bloques);
          const cls = claseJ(t);
          const tag = cls ? `<span class="tag">${cls === 'ruido' ? 'ruido' : cls === 'corrupta' ? 'corrupto' : 'mixto'}</span>` : '';
          return `<p class="barra ${cls}" data-i0="${p.i0}" ${t ? `title="${esc(tituloJ(t))}"` : ''}>${tag}${esc(p.t)}</p>`;
        }).join('');
      caja.scrollTop = 0;
    } catch (e) {
      caja.innerHTML = '<p class="meta">No se pudo cargar esa batalla.</p>';
    }
  }

  $('#q').addEventListener('input', filtra);
  $('#filtro-j').addEventListener('change', filtra);
  $('#volver').addEventListener('click', portada);
  $('#tema').addEventListener('click', function () {
    var n = document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro';
    document.documentElement.dataset.tema = n;
    localStorage.setItem('tema', n);
  });
  $('#lista').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if (b) abre(b.dataset.id);
  });
  // clic en un segmento de la barra: baja al bloque correspondiente y lo destaca un momento
  $('#texto').addEventListener('click', e => {
    const s = e.target.closest('.dist button[data-i0]');
    if (!s) return;
    const destino = $('#texto').querySelector(`p.barra[data-i0="${s.dataset.i0}"]`);
    if (!destino) return;
    destino.scrollIntoView({ behavior: 'smooth', block: 'center' });
    destino.classList.add('destacado');
    setTimeout(() => destino.classList.remove('destacado'), 1600);
  });
  lista();
</script>
</body>
</html>
