<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batallas de gallos</title>
<style>
  :root { --papel:#f4f5f2; --tinta:#14161a; --tenue:#666c66; --linea:#d3d7d0 }
  * { box-sizing:border-box }
  body { margin:0; height:100dvh; display:flex; flex-direction:column;
         background:var(--papel); color:var(--tinta); font:16px/1.5 Georgia,serif }
  header { display:flex; gap:.8rem; align-items:center; padding:.6rem 1rem; border-bottom:2px solid var(--tinta) }
  h1 { font:400 1.2rem/1 "Arial Narrow",sans-serif; margin:0; white-space:nowrap }
  input { flex:1; max-width:22rem; padding:.3rem .5rem; border:1px solid var(--tinta);
          background:#fff; font:inherit; font-size:.9rem }
  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,270px) minmax(0,1fr) }
  #lista { overflow-y:auto; border-right:1px solid var(--linea); margin:0; padding:0; list-style:none }
  #lista button { display:block; width:100%; text-align:left; padding:.4rem .6rem; border:0;
                  border-bottom:1px solid var(--linea); background:none; font:inherit;
                  font-size:.85rem; line-height:1.25; cursor:pointer }
  #lista button:hover, #lista button[aria-current] { background:#e9ebe6 }
  #lista b { display:block }
  #lista span { color:var(--tenue); font-size:.85em }
  #texto { overflow-y:auto; padding:1rem 1.2rem 3rem }
  #texto h2 { font:400 1.45rem/1.05 "Arial Narrow",sans-serif; margin:0 0 .3rem }
  #texto .meta { margin:0 0 1rem; color:var(--tenue); font-size:.8rem }
  #texto p.barra { margin:0 0 .6rem; max-width:66ch }
  @media (max-width:700px) {
    main { grid-template-columns:1fr; grid-template-rows:minmax(0,38%) minmax(0,1fr) }
    #lista { border-right:0; border-bottom:1px solid var(--linea) }
  }
</style>
</head>
<body>
<header>
  <h1>Batallas de gallos</h1>
  <input id="q" type="search" placeholder="Buscar MC, evento o ronda…">
</header>
<main>
  <ol id="lista"></ol>
  <div id="texto"><p class="meta">Elige una batalla en la lista.</p></div>
</main>

<script src="data/index.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const nf = new Intl.NumberFormat('es-ES');
  const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const CORPUS = window.CORPUS || [];
  const cache = {};
  let filtro = CORPUS, actual = null;

  function lista() {
    $('#lista').innerHTML = filtro.map(b => {
      const quien = (b.mcs || []).join(' vs ') || b.title || b.video_id;
      const donde = [b.event, b.round, b.year].filter(Boolean).join(' · ');
      return `<li><button data-id="${b.video_id}"${b.video_id === actual ? ' aria-current="true"' : ''}>
        <b>${esc(quien)}</b><span>${esc(donde)}</span></button></li>`;
    }).join('') || '<li style="padding:.6rem">Nada con ese filtro.</li>';
  }

  function filtra() {
    const q = $('#q').value.trim().toLowerCase();
    filtro = CORPUS.filter(b => !q ||
      [b.title, b.event, b.round, (b.mcs || []).join(' ')].join(' ').toLowerCase().includes(q));
    lista();
  }

  // junta las lineas de subtitulo en parrafos legibles de ~45 palabras
  function parrafos(lineas) {
    const out = []; let cur = [], n = 0;
    for (const l of lineas) {
      const t = String(l || '').replace(/\[[^\]]*\]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!t) continue;
      cur.push(t); n += t.split(' ').length;
      if (n >= 45) { out.push(cur.join(' ')); cur = []; n = 0; }
    }
    if (cur.length) out.push(cur.join(' '));
    return out;
  }

  async function abre(id) {
    actual = id; lista();
    const caja = $('#texto');
    caja.innerHTML = '<p class="meta">Cargando…</p>';
    try {
      const b = cache[id] || (cache[id] = await (await fetch('data/battles/' + id + '.json')).json());
      const mcs = (b.mcs || []).map(esc);
      const titulo = mcs.length
        ? mcs.join(' <span style="font-family:Georgia;font-style:italic;font-size:.65em;color:#666">contra</span> ')
        : esc(b.title || id);
      const meta = [b.event, b.round, b.year, b.format,
                    nf.format(b.n_words) + ' palabras'].filter(Boolean).join(' · ');
      caja.innerHTML = `<h2>${titulo}</h2>
        <p class="meta">${esc(meta)} · <a href="${b.url}" target="_blank" rel="noopener">vídeo</a></p>` +
        parrafos(b.lines).map(p => `<p class="barra">${esc(p)}</p>`).join('');
      caja.scrollTop = 0;
    } catch (e) {
      caja.innerHTML = '<p class="meta">No se pudo cargar esa batalla.</p>';
    }
  }

  $('#q').addEventListener('input', filtra);
  $('#lista').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if (b) abre(b.dataset.id);
  });
  lista();
</script>
</body>
</html>
