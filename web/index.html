<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acta de barras — batallas de gallos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">

  <header class="barra-sup">
    <h1>Acta de barras</h1>
    <div class="buscar">
      <input id="q" type="search" placeholder="Buscar MC, evento, ronda…" autocomplete="off" aria-label="Buscar">
      <label class="interruptor" id="lbl-full" title="Busca en todas las transcripciones (tarda un poco)">
        <input type="checkbox" id="fulltext"> <span>en el texto</span>
      </label>
      <span class="progreso" id="progreso" hidden></span>
    </div>
    <nav class="pestanas" role="tablist">
      <button role="tab" id="tab-lector" aria-controls="panel-lector" aria-selected="true">Batalla</button>
      <button role="tab" id="tab-corpus" aria-controls="panel-corpus" aria-selected="false">Corpus</button>
    </nav>
  </header>

  <!-- ------------------------------------------------ batalla -->
  <section class="panel" id="panel-lector" role="tabpanel" aria-labelledby="tab-lector">

    <aside class="pane lista-pane" id="lista-pane">
      <p class="recuento" id="recuento"></p>
      <ol class="lista" id="lista"></ol>
      <button class="mas" id="mas" hidden></button>
    </aside>

    <main class="pane lector-pane" id="lector">
      <p class="vacio" id="vacio">Elige una batalla en la lista.</p>
    </main>

  </section>

  <!-- ------------------------------------------------ corpus -->
  <section class="panel" id="panel-corpus" role="tabpanel" aria-labelledby="tab-corpus" hidden>
    <div class="pane corpus-pane">
      <dl class="cifras" id="cifras"></dl>
      <div class="rejilla" id="graficas"></div>
    </div>
  </section>

</div>

<script src="data/index.js"></script>
<script src="app.js"></script>
</body>
</html>
