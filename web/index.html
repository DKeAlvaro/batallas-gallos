<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acta de barras — batallas de gallos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecera">
  <div class="marca">
    <h1>Acta de barras</h1>
    <p>Transcripciones de batallas de gallos en español, agrupadas en tiradas legibles.</p>
  </div>
  <dl class="cifras" id="cifras"></dl>
</header>

<nav class="pestanas" role="tablist">
  <button role="tab" id="tab-lector" aria-controls="panel-lector" aria-selected="true">Lector</button>
  <button role="tab" id="tab-corpus" aria-controls="panel-corpus" aria-selected="false">El corpus</button>
  <span class="aviso" id="aviso" hidden></span>
</nav>

<!-- ------------------------------------------------ lector -->
<section class="panel" id="panel-lector" role="tabpanel" aria-labelledby="tab-lector">
  <div class="columna-izq">
    <div class="filtros">
      <label for="q" class="etiqueta">Buscar por MC, evento o ronda</label>
      <input id="q" type="search" placeholder="Aczino, FMS México, octavos…" autocomplete="off">
      <label class="interruptor" id="lbl-full">
        <input type="checkbox" id="fulltext">
        <span>Buscar también dentro de las transcripciones</span>
      </label>
      <p class="progreso" id="progreso" hidden></p>
    </div>
    <ol class="lista" id="lista"></ol>
    <button class="mas" id="mas" hidden>Mostrar más batallas</button>
  </div>

  <article class="lector" id="lector">
    <p class="vacio" id="vacio">Elige una batalla de la izquierda.</p>
  </article>
</section>

<!-- ------------------------------------------------ corpus -->
<section class="panel" id="panel-corpus" role="tabpanel" aria-labelledby="tab-corpus" hidden>
  <div class="rejilla" id="graficas"></div>
</section>

<footer class="pie">
  <p id="pie-txt"></p>
  <p>Los textos vienen de los subtítulos automáticos de YouTube y pertenecen a sus autores.
     <span id="pie-aviso"></span></p>
</footer>

<script src="data/index.js"></script>
<script src="app.js"></script>
</body>
</html>
